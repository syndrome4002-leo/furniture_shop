services:
  strapi:
    build:
      context: ./app
    container_name: heirloom-strapi
    restart: unless-stopped
    environment:
      # Point Strapi at the Postgres container. Secrets (APP_KEYS,
      # ADMIN_JWT_SECRET, etc.) come from app/.env, generated by the scaffold.
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: "false"
    volumes:
      # Bind-mount the source so content types created in the admin UI
      # (src/api/...) persist to the host. node_modules stays as the
      # image-built copy via the anonymous volume below.
      - ./app:/opt/app
      - /opt/app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: heirloom-strapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
      - strapi-db:/var/lib/postgresql/data

volumes:
  strapi-db:
